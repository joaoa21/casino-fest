<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0817">
  <title>Casino Fest | Poker Texas Hold'em</title>
  <meta name="description" content="Texas Hold'em sem limite contra três adversários com estilos diferentes. Fichas de brincadeira.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Casino Fest">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Poker Texas Hold'em · Casino Fest">
  <meta property="og:description" content="Texas Hold'em sem limite contra três adversários com estilos diferentes. Fichas de brincadeira.">
  <meta property="og:url" content="https://joaoa21.github.io/casino-fest/poker.html">
  <meta property="og:image" content="https://joaoa21.github.io/casino-fest/lobby/poker.webp">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://joaoa21.github.io/casino-fest/poker.html">
  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Luckiest+Guy&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-game="poker">

  <!-- Cabeçalho do cassino (montado pelo casino.js) -->
  <header class="site-header"></header>
  <script src="casino.js"></script>

  <div class="app">

    <!-- ============ Barra da mesa ============ -->
    <section class="table-bar" aria-label="Informações da mesa">
      <div class="tb-title">
        <h1>Mesa Fest</h1>
        <span class="tb-sub">Texas Hold'em · No Limit · 4 jogadores</span>
      </div>
      <div class="tb-stats">
        <div class="stat"><span class="stat-label">Mão</span><b id="info-hand">1</b></div>
        <div class="stat"><span class="stat-label">Blinds</span><b id="info-blinds">10/20</b></div>
        <div class="stat level">
          <span class="stat-label" id="info-level">Nível 1</span>
          <span class="level-bar"><i id="level-fill"></i></span>
          <span class="level-next" id="info-next">sobe em 8 mãos</span>
        </div>
      </div>
      <button id="btn-new" class="btn-ghost" type="button"><svg><use href="#i-refresh"/></svg>Nova mesa</button>
    </section>

    <div class="layout">
      <main class="play">
        <section class="table" id="table" aria-label="Mesa de poker">
          <div class="felt-mark" aria-hidden="true">Casino<span>Fest</span></div>
          <div class="center">
            <div class="pot" id="pot">
              <div class="pot-chips" id="pot-chips"></div>
              <div class="pot-amount"><span>Pote</span><b id="pot-amount">$0</b></div>
            </div>
            <div class="board" id="board"></div>
            <div class="banner" id="banner" hidden>
              <span class="banner-rays" aria-hidden="true"></span>
              <span class="banner-kicker" id="banner-kicker"></span>
              <strong class="banner-title" id="banner-title"></strong>
              <span class="banner-amount" id="banner-amount"><svg aria-hidden="true"><use href="#chip3d"/></svg><b id="banner-amount-text"></b></span>
            </div>
          </div>
          <div id="seats"></div>
        </section>

        <section class="controls" id="controls">
          <div class="status" id="status" aria-live="polite"></div>

          <div class="dock">
            <div class="raise-box" id="raise-box">
              <div class="quick">
                <button type="button" data-frac="0.5">½ Pote</button>
                <button type="button" data-frac="0.75">¾ Pote</button>
                <button type="button" data-frac="1">Pote</button>
                <button type="button" data-frac="max">All-in</button>
              </div>
              <div class="slider">
                <button type="button" id="amt-minus" aria-label="Diminuir aposta">−</button>
                <input type="range" id="raise-range" min="0" max="100" value="0" step="1" aria-label="Valor da aposta">
                <button type="button" id="amt-plus" aria-label="Aumentar aposta">+</button>
              </div>
            </div>

            <div class="actions" id="actions">
              <button type="button" id="btn-fold" class="btn fold"><span>Desistir</span> <kbd>F</kbd></button>
              <button type="button" id="btn-call" class="btn call"><span id="call-label">Check</span> <kbd>C</kbd></button>
              <button type="button" id="btn-raise" class="btn raise"><span id="raise-label">Aumentar</span> <kbd>R</kbd></button>
            </div>

            <div class="next-row" id="next-row" hidden>
              <button type="button" id="btn-next" class="btn next">Próxima mão</button>
            </div>
          </div>
        </section>
      </main>

      <aside class="log-wrap">
        <h2><svg><use href="#i-history"/></svg>Histórico da mesa</h2>
        <ul id="log" class="log"></ul>
      </aside>
    </div>

  </div>

  <script src="poker.js"></script>
</body>
</html>
