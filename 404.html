<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0817">
  <meta name="robots" content="noindex">
  <title>Casino Fest | Página não encontrada</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Luckiest+Guy&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .nf { min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 40px 20px; }
    .nf-code { font: 400 clamp(72px, 16vw, 150px) / 1 'Luckiest Guy', var(--display); color: var(--gold); -webkit-text-stroke: 4px #3d1a05; paint-order: stroke fill; text-shadow: 0 8px 0 #3d1a05, 0 0 46px rgba(255, 201, 64, .5); transform: rotate(-3deg); }
    .nf h1 { margin: 0; font: 400 clamp(24px, 4vw, 36px) var(--display); color: #fff; }
    .nf p { margin: 0; color: var(--muted); max-width: 440px; line-height: 1.5; }
    .nf .btn { margin-top: 10px; padding: 14px 36px; text-decoration: none; background: linear-gradient(180deg, #ff6b9d, var(--pink) 50%, var(--pink-deep)); --btn-edge: #7d0a42; font: 400 20px var(--display); letter-spacing: .04em; }
  </style>
</head>
<body data-game="home">
  <header class="site-header"></header>
  <script src="casino.js"></script>
  <div class="app">
    <section class="nf">
      <div class="nf-code" aria-hidden="true">404</div>
      <h1>Essa mesa não existe</h1>
      <p>A página que você procurou não está no cassino. Volte para o início e escolha um jogo.</p>
      <a class="btn" href="index.html">Voltar ao início</a>
    </section>
  </div>
</body>
</html>
